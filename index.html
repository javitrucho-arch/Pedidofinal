            // ===== DRAG & DROP PARA PROVEEDORES (CORREGIDO - SOLO EN HANDLE) =====
            setupProveedorDragDrop() {
                const items = document.querySelectorAll('.proveedor-item');
                
                items.forEach(item => {
                    // Eventos para mouse (drag & drop nativo)
                    item.addEventListener('dragstart', (e) => this.onProveedorDragStart(e));
                    item.addEventListener('dragend', (e) => this.onProveedorDragEnd(e));
                    item.addEventListener('dragover', (e) => this.onProveedorDragOver(e));
                    item.addEventListener('dragleave', (e) => this.onProveedorDragLeave(e));
                    item.addEventListener('drop', (e) => this.onProveedorDrop(e));

                    // ===== TÁCTIL: SOLO EN EL HANDLE =====
                    const handle = item.querySelector('.handle');
                    if (handle) {
                        // Touch events solo en el handle
                        handle.addEventListener('touchstart', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            this.startTouchDrag(e, item);
                        }, { passive: false });
                    }
                });

                document.addEventListener('dragover', (e) => e.preventDefault());
                document.addEventListener('drop', (e) => e.preventDefault());
            }

            startTouchDrag(e, item) {
                const touch = e.touches ? e.touches[0] : e;
                const touchStartY = touch.clientY;
                
                const originalIndex = parseInt(item.dataset.index);
                
                this.touchDragData = {
                    item: item,
                    index: originalIndex,
                    startY: touchStartY,
                    isDragging: true
                };
                
                item.classList.add('dragging');
                
                // Crear un clon para seguir el dedo
                const clone = item.cloneNode(true);
                clone.style.position = 'fixed';
                clone.style.pointerEvents = 'none';
                clone.style.opacity = '0.7';
                clone.style.transform = 'scale(1.05)';
                clone.style.zIndex = '999';
                clone.style.width = item.offsetWidth + 'px';
                clone.style.left = (item.getBoundingClientRect().left) + 'px';
                clone.style.top = (touch.clientY - 20) + 'px';
                clone.id = 'dragClone';
                document.body.appendChild(clone);
                
                item.style.opacity = '0.3';
                
                const onTouchMove = (ev) => {
                    ev.preventDefault();
                    const touchMove = ev.touches[0];
                    const currentY = touchMove.clientY;
                    
                    // Mover el clon
                    const cloneEl = document.getElementById('dragClone');
                    if (cloneEl) {
                        cloneEl.style.top = (touchMove.clientY - 20) + 'px';
                    }
                    
                    // Buscar el elemento destino
                    const allItems = document.querySelectorAll('.proveedor-item');
                    let targetItem = null;
                    
                    allItems.forEach(el => {
                        if (el !== item) {
                            const rect = el.getBoundingClientRect();
                            if (currentY >= rect.top && currentY <= rect.bottom) {
                                targetItem = el;
                            }
                        }
                    });
                    
                    // Limpiar estilos de todos
                    allItems.forEach(el => {
                        el.classList.remove('drag-over');
                        el.style.borderColor = 'transparent';
                    });
                    
                    if (targetItem) {
                        targetItem.classList.add('drag-over');
                        targetItem.style.borderColor = '#2196F3';
                        targetItem.style.borderStyle = 'dashed';
                    }
                    
                    // Auto-scroll
                    const scrollContainer = this.listaScroll;
                    const scrollRect = scrollContainer.getBoundingClientRect();
                    
                    if (currentY < scrollRect.top + 40) {
                        scrollContainer.scrollTop -= 10;
                    } else if (currentY > scrollRect.bottom - 40) {
                        scrollContainer.scrollTop += 10;
                    }
                };
                
                const onTouchEnd = (ev) => {
                    // Eliminar el clon
                    const cloneEl = document.getElementById('dragClone');
                    if (cloneEl) cloneEl.remove();
                    
                    // Restaurar opacidad
                    item.style.opacity = '1';
                    item.classList.remove('dragging');
                    
                    // Limpiar estilos de todos
                    document.querySelectorAll('.proveedor-item').forEach(el => {
                        el.classList.remove('drag-over');
                        el.style.borderColor = 'transparent';
                        el.style.borderStyle = 'solid';
                    });
                    
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                    
                    // Buscar el destino final
                    let targetItem = null;
                    let targetIndex = -1;
                    
                    document.querySelectorAll('.proveedor-item').forEach(el => {
                        if (el.classList.contains('drag-over')) {
                            targetItem = el;
                            targetIndex = parseInt(el.dataset.index);
                            el.classList.remove('drag-over');
                            el.style.borderColor = 'transparent';
                        }
                    });
                    
                    if (targetItem && targetIndex !== -1 && targetIndex !== this.touchDragData.index) {
                        this.reordenarProveedores(this.touchDragData.index, targetIndex);
                    }
                    
                    this.touchDragData = null;
                };
                
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd, { passive: false });
            }

            onProveedorDragStart(e) {
                const item = e.currentTarget;
                this.dragProveedor = {
                    element: item,
                    id: parseInt(item.dataset.id),
                    index: parseInt(item.dataset.index)
                };
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', item.dataset.id);
                item.style.opacity = '0.4';
            }

            onProveedorDragEnd(e) {
                const item = e.currentTarget;
                item.classList.remove('dragging');
                item.style.opacity = '1';
                document.querySelectorAll('.proveedor-item').forEach(el => {
                    el.classList.remove('drag-over');
                    el.style.borderColor = 'transparent';
                });
                this.dragProveedor = null;
            }

            onProveedorDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const target = e.currentTarget;
                if (target !== this.dragProveedor?.element) {
                    target.classList.add('drag-over');
                    target.style.borderColor = '#2196F3';
                    target.style.borderStyle = 'dashed';
                }
            }

            onProveedorDragLeave(e) {
                const target = e.currentTarget;
                target.classList.remove('drag-over');
                target.style.borderColor = 'transparent';
            }

            onProveedorDrop(e) {
                e.preventDefault();
                const target = e.currentTarget;
                target.classList.remove('drag-over');
                target.style.borderColor = 'transparent';

                if (!this.dragProveedor || target === this.dragProveedor.element) {
                    this.dragProveedor = null;
                    return;
                }

                const fromIndex = this.dragProveedor.index;
                const toIndex = parseInt(target.dataset.index);

                if (fromIndex === toIndex) {
                    this.dragProveedor = null;
                    return;
                }

                this.reordenarProveedores(fromIndex, toIndex);
                this.dragProveedor = null;
            }

            async reordenarProveedores(fromIndex, toIndex) {
                try {
                    const [movedItem] = this.proveedores.splice(fromIndex, 1);
                    this.proveedores.splice(toIndex, 0, movedItem);

                    this.proveedores.forEach((item, index) => {
                        item.orden = index;
                    });

                    for (const item of this.proveedores) {
                        await this.db.updateProveedor(item);
                    }

                    await this.cargarProveedores();
                    this.renderizarProveedores();
                    this.mostrarToast('Orden actualizado 🔄');
                } catch (error) {
                    console.error('Error al reordenar:', error);
                    this.mostrarToast('Error al reordenar', 'warning');
                    await this.cargarProveedores();
                    this.renderizarProveedores();
                }
            }

            setupProveedorEvents() {
                document.querySelectorAll('.btn-editar-proveedor').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = parseInt(e.currentTarget.dataset.id);
                        this.editarProveedor(id);
                    });
                });

                document.querySelectorAll('.btn-eliminar-proveedor').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const id = parseInt(e.currentTarget.dataset.id);
                        const prov = this.proveedores.find(p => p.id === id);
                        if (!prov) return;
                        
                        const confirmado = await confirmPersonalizado(
                            `¿Eliminar el proveedor "${prov.nombre}" y todos sus artículos?`,
                            'Eliminar Proveedor',
                            '🗑️',
                            'peligro'
                        );
                        
                        if (confirmado) {
                            await this.eliminarProveedor(id);
                        }
                    });
                });

                document.querySelectorAll('.proveedor-item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.btn') || e.target.closest('.handle')) return;
                        const id = parseInt(el.dataset.id);
                        const prov = this.proveedores.find(p => p.id === id);
                        if (prov) this.mostrarVistaArticulos(prov);
                    });
                });
            }

            setupArticuloEvents() {
                document.querySelectorAll('.checkbox').forEach(cb => {
                    cb.addEventListener('change', (e) => {
                        e.stopPropagation();
                        this.toggleSeleccionArticulo(
                            parseInt(e.target.dataset.id), 
                            e.target.checked
                        );
                    });
                });

                document.querySelectorAll('.item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.checkbox') || e.target.closest('.btn')) return;
                        const id = parseInt(el.dataset.id);
                        this.abrirModalEditar(id);
                    });
                });

                document.querySelectorAll('.item').forEach(el => {
                    el.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        const nombre = el.querySelector('.nombre')?.textContent || '';
                        if (nombre) {
                            this.copiarAlPortapapeles(nombre);
                            this.mostrarToast('📋 Nombre copiado: ' + nombre);
                        }
                    });

                    let longPressTimer = null;
                    el.addEventListener('touchstart', (e) => {
                        longPressTimer = setTimeout(() => {
                            const nombre = el.querySelector('.nombre')?.textContent || '';
                            if (nombre) {
                                e.preventDefault();
                                this.copiarAlPortapapeles(nombre);
                                this.mostrarToast('📋 Nombre copiado: ' + nombre);
                            }
                        }, 600);
                    });
                    el.addEventListener('touchmove', () => {
                        clearTimeout(longPressTimer);
                    });
                    el.addEventListener('touchend', () => {
                        clearTimeout(longPressTimer);
                    });
                });

                document.querySelectorAll('.btn-eliminar-articulo').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const id = parseInt(e.currentTarget.dataset.id);
                        const item = this.articulos.find(a => a.id === id);
                        if (!item) return;
                        
                        const confirmado = await confirmPersonalizado(
                            `¿Eliminar el artículo "${item.nombre}"?`,
                            'Eliminar Artículo',
                            '🗑️',
                            'peligro'
                        );
                        
                        if (confirmado) {
                            await this.eliminarArticulo(id);
                        }
                    });
                });

                document.querySelectorAll('.item').forEach(el => {
                    el.addEventListener('dragstart', (e) => this.onDragStart(e));
                    el.addEventListener('dragend', (e) => this.onDragEnd(e));
                    el.addEventListener('dragover', (e) => this.onDragOver(e));
                    el.addEventListener('dragleave', (e) => this.onDragLeave(e));
                    el.addEventListener('drop', (e) => this.onDrop(e));
                });
            }

            async guardarProveedor() {
                const nombre = this.inputNombre.value.trim();

                if (!nombre) {
                    this.mostrarToast('Por favor ingresa un nombre', 'warning');
                    return;
                }

                if (this.editingId) {
                    const prov = this.proveedores.find(p => p.id === this.editingId);
                    if (prov) {
                        prov.nombre = nombre;
                        await this.db.updateProveedor(prov);
                        this.mostrarToast('Proveedor modificado ✅');
                    }
                    this.editingId = null;
                    this.btnGuardar.textContent = 'Agregar';
                } else {
                    const maxOrden = this.proveedores.reduce((max, p) => Math.max(max, p.orden || 0), -1);
                    const newProv = {
                        nombre: nombre,
                        orden: maxOrden + 1
                    };
                    const id = await this.db.addProveedor(newProv);
                    newProv.id = id;
                    this.proveedores.push(newProv);
                    this.mostrarToast('Proveedor agregado ✅');
                }

                this.inputNombre.value = '';
                await this.cargarProveedores();
                this.renderizarProveedores();
                this.inputNombre.focus();
            }

            async editarProveedor(id) {
                const prov = this.proveedores.find(p => p.id === id);
                if (!prov) return;

                this.inputNombre.value = prov.nombre;
                this.editingId = id;
                this.btnGuardar.textContent = '✏️ Modificar';
                this.inputNombre.focus();
                this.inputNombre.scrollIntoView({ behavior: 'smooth' });
                
                history.pushState({ vista: 'proveedores', editando: true }, '');
            }

            async eliminarProveedor(id) {
                await this.db.deleteArticulosByProveedor(id);
                await this.db.deleteProveedor(id);
                this.proveedores = this.proveedores.filter(p => p.id !== id);
                await this.cargarProveedores();
                this.renderizarProveedores();
                this.mostrarToast('Proveedor eliminado 🗑️');
            }

            async guardarArticuloDesdeModal() {
                const nombre = this.modalNombre.value.trim();
                const cant = this.modalCant.value.trim();

                if (!nombre) {
                    this.mostrarToast('Por favor ingresa un nombre', 'warning');
                    return;
                }

                if (this.modalModo === 'editar' && this.editingId) {
                    const item = this.articulos.find(a => a.id === this.editingId);
                    if (item) {
                        item.nombre = nombre;
                        item.cant = cant;
                        await this.db.updateArticulo(item);
                        this.mostrarToast('Artículo modificado ✅');
                    }
                    this.editingId = null;
                } else {
                    const maxOrden = this.articulos.reduce((max, item) => Math.max(max, item.orden || 0), -1);
                    const newItem = {
                        proveedorId: this.proveedorActual.id,
                        nombre: nombre,
                        cant: cant,
                        sel: false,
                        orden: maxOrden + 1
                    };
                    const id = await this.db.addArticulo(newItem);
                    newItem.id = id;
                    this.articulos.push(newItem);
                    
                    this.mostrarToast('Artículo agregado ✅');
                }

                this.cerrarModal();
                await this.cargarArticulos(this.proveedorActual.id);
                this.renderizarArticulos();
            }

            async eliminarArticulo(id) {
                await this.db.deleteArticulo(id);
                this.articulos = this.articulos.filter(a => a.id !== id);
                await this.cargarArticulos(this.proveedorActual.id);
                this.renderizarArticulos();
                this.mostrarToast('Artículo eliminado 🗑️');
            }

            async toggleSeleccionArticulo(id, checked) {
                const item = this.articulos.find(a => a.id === id);
                if (item) {
                    item.sel = checked;
                    await this.db.updateArticulo(item);
                }
            }

            abrirModalAgregar() {
                this.modalModo = 'agregar';
                this.modalTitulo.textContent = 'Agregar Artículo';
                this.modalCant.value = '';
                this.modalNombre.value = '';
                this.editingId = null;
                this.modalOverlay.classList.add('active');
                setTimeout(() => this.modalCant.focus(), 100);
            }

            abrirModalEditar(id) {
                const item = this.articulos.find(a => a.id === id);
                if (!item) return;

                this.modalModo = 'editar';
                this.modalTitulo.textContent = 'Editar Artículo';
                this.modalCant.value = item.cant || '';
                this.modalNombre.value = item.nombre;
                this.editingId = id;
                this.modalOverlay.classList.add('active');
                setTimeout(() => this.modalCant.focus(), 100);
            }

            cerrarModal() {
                this.modalOverlay.classList.remove('active');
                this.modalCant.value = '';
                this.modalNombre.value = '';
                this.editingId = null;
                setTimeout(() => {
                    if (this.vista === 'articulos') {
                        document.activeElement?.blur();
                    }
                }, 100);
            }

            async ordenarSeleccionadosArriba() {
                const seleccionados = this.articulos.filter(a => a.sel);
                if (seleccionados.length === 0) {
                    this.mostrarToast('No hay artículos seleccionados', 'warning');
                    return;
                }

                const noSeleccionados = this.articulos.filter(a => !a.sel);
                this.articulos = [...seleccionados, ...noSeleccionados];
                
                this.articulos.forEach((item, index) => {
                    item.orden = index;
                });
                
                for (const item of this.articulos) {
                    await this.db.updateArticulo(item);
                }
                
                await this.cargarArticulos(this.proveedorActual.id);
                this.renderizarArticulos();
                this.mostrarToast(`${seleccionados.length} artículos movidos arriba ✅`);
            }

            async ordenarAlfabetico() {
                if (this.vista === 'proveedores') {
                    this.proveedores.sort((a, b) => a.nombre.localeCompare(b.nombre));
                    this.proveedores.forEach((item, index) => {
                        item.orden = index;
                    });
                    for (const item of this.proveedores) {
                        await this.db.updateProveedor(item);
                    }
                    await this.cargarProveedores();
                    this.renderizarProveedores();
                    this.mostrarToast('Proveedores ordenados alfabéticamente ✅');
                    return;
                }
                
                this.articulos.sort((a, b) => a.nombre.localeCompare(b.nombre));
                
                this.articulos.forEach((item, index) => {
                    item.orden = index;
                });
                
                for (const item of this.articulos) {
                    await this.db.updateArticulo(item);
                }
                
                await this.cargarArticulos(this.proveedorActual.id);
                this.renderizarArticulos();
                this.mostrarToast('Orden alfabético aplicado ✅');
            }

            async compartirSeleccionados() {
                const seleccionados = this.articulos.filter(a => a.sel);
                
                if (seleccionados.length === 0) {
                    this.mostrarToast('No hay artículos seleccionados', 'warning');
                    return;
                }

                let texto = '';
                seleccionados.forEach((item) => {
                    texto += `${item.cant || ''}   ${item.nombre}\n`;
                });

                if (navigator.share) {
                    navigator.share({
                        title: 'Artículos seleccionados',
                        text: texto
                    })
                    .then(() => {
                        this.mostrarToast('Compartido ✅');
                    })
                    .catch((error) => {
                        if (error.name !== 'AbortError') {
                            this.copiarAlPortapapeles(texto);
                        }
                    });
                } else {
                    this.copiarAlPortapapeles(texto);
                }
            }

            async limpiarSeleccion() {
                const seleccionados = this.articulos.filter(a => a.sel);
                if (seleccionados.length === 0) {
                    this.mostrarToast('No hay artículos seleccionados', 'info');
                    return;
                }

                const confirmado = await confirmPersonalizado(
                    `¿Limpiar la selección de ${seleccionados.length} artículos?`,
                    'Limpiar Selección',
                    '🧹'
                );

                if (!confirmado) return;

                for (const item of seleccionados) {
                    item.sel = false;
                    await this.db.updateArticulo(item);
                }
                await this.cargarArticulos(this.proveedorActual.id);
                this.renderizarArticulos();
                this.mostrarToast('Selección limpiada ✅');
            }

            async hacerBackup() {
                try {
                    const data = await this.db.exportarDatos();
                    const json = JSON.stringify(data, null, 2);
                    const blob = new Blob([json], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.href = url;
                    const fecha = new Date().toISOString().slice(0, 10);
                    link.download = `backup_${fecha}.json`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    
                    this.mostrarToast('Backup guardado ✅');
                } catch (error) {
                    console.error('Error al hacer backup:', error);
                    this.mostrarToast('Error al guardar backup', 'warning');
                }
            }

            async recuperarBackup() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const nombreArchivo = file.name;
                    this.mostrarToast('📁 Archivo: ' + nombreArchivo, 'info');
                    
                    try {
                        const text = await file.text();
                        const data = JSON.parse(text);
                        
                        if (!data.proveedores || !data.articulos) {
                            this.mostrarToast('Archivo de backup inválido', 'warning');
                            return;
                        }
                        
                        const confirmado = await confirmPersonalizado(
                            `¿Recuperar backup desde "${nombreArchivo}"?`,
                            'Recuperar Backup',
                            '📤'
                        );
                        
                        if (!confirmado) return;
                        
                        await this.db.importarDatos(data);
                        await this.cargarProveedores();
                        this.renderizarProveedores();
                        this.mostrarToast('✅ Backup recuperado: ' + nombreArchivo);
                        
                        if (this.vista === 'articulos') {
                            this.mostrarVistaProveedores();
                        }
                    } catch (error) {
                        console.error('Error al recuperar backup:', error);
                        this.mostrarToast('Error al recuperar backup', 'warning');
                    }
                };
                
                input.click();
            }

            // ===== DRAG & DROP PARA ARTÍCULOS =====
            onDragStart(e) {
                const item = e.currentTarget;
                this.dragItem = {
                    element: item,
                    id: parseInt(item.dataset.id),
                    index: parseInt(item.dataset.index)
                };
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', item.dataset.id);
                item.style.opacity = '0.5';
            }

            onDragEnd(e) {
                const item = e.currentTarget;
                item.classList.remove('dragging');
                item.style.opacity = '1';
                document.querySelectorAll('.item').forEach(el => {
                    el.classList.remove('drag-over');
                    el.style.borderColor = 'transparent';
                });
                this.dragItem = null;
            }

            onDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const target = e.currentTarget;
                if (target !== this.dragItem?.element) {
                    target.classList.add('drag-over');
                    target.style.borderColor = '#2196F3';
                }
            }

            onDragLeave(e) {
                const target = e.currentTarget;
                target.classList.remove('drag-over');
                target.style.borderColor = 'transparent';
            }

            async onDrop(e) {
                e.preventDefault();
                const target = e.currentTarget;
                target.classList.remove('drag-over');
                target.style.borderColor = 'transparent';

                if (!this.dragItem || target === this.dragItem.element) {
                    this.dragItem = null;
                    return;
                }

                const fromIndex = this.dragItem.index;
                const toIndex = parseInt(target.dataset.index);

                if (fromIndex === toIndex) {
                    this.dragItem = null;
                    return;
                }

                try {
                    const [movedItem] = this.articulos.splice(fromIndex, 1);
                    this.articulos.splice(toIndex, 0, movedItem);

                    this.articulos.forEach((item, index) => {
                        item.orden = index;
                    });

                    for (const item of this.articulos) {
                        await this.db.updateArticulo(item);
                    }

                    await this.cargarArticulos(this.proveedorActual.id);
                    this.renderizarArticulos();
                    this.mostrarToast('Orden actualizado 🔄');
                } catch (error) {
                    console.error('Error al mover:', error);
                    this.mostrarToast('Error al mover', 'warning');
                    await this.cargarArticulos(this.proveedorActual.id);
                    this.renderizarArticulos();
                }

                this.dragItem = null;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            copiarAlPortapapeles(texto) {
                navigator.clipboard.writeText(texto)
                    .then(() => {})
                    .catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = texto;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                    });
            }

            mostrarToast(mensaje, tipo = 'success') {
                const toast = this.toast;
                toast.textContent = mensaje;
                toast.style.display = 'block';
                toast.style.background = tipo === 'warning' ? 'rgba(255, 152, 0, 0.9)' : 
                                       tipo === 'info' ? 'rgba(33, 150, 243, 0.9)' : 
                                       'rgba(76, 175, 80, 0.9)';
                clearTimeout(this.toastTimeout);
                this.toastTimeout = setTimeout(() => {
                    toast.style.display = 'none';
                }, 3000);
            }

            setupEventListeners() {
                this.btnBack.addEventListener('click', () => {
                    if (this.modalOverlay.classList.contains('active')) {
                        this.cerrarModal();
                        return;
                    }
                    if (this.editingId !== null && this.vista === 'proveedores') {
                        this.cancelarEdicionProveedor();
                        return;
                    }
                    this.mostrarVistaProveedores();
                });

                this.btnCompartirHeader.addEventListener('click', () => {
                    if (this.vista === 'articulos') {
                        this.compartirSeleccionados();
                    }
                });

                this.btnGuardar.addEventListener('click', () => this.guardarProveedor());
                this.inputNombre.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.guardarProveedor();
                });

                this.btnSeleccionadosArriba.addEventListener('click', () => this.ordenarSeleccionadosArriba());
                this.btnOrdenarAlfabetico.addEventListener('click', () => this.ordenarAlfabetico());
                this.btnLimpiar.addEventListener('click', () => this.limpiarSeleccion());
                this.btnAgregarAcciones.addEventListener('click', () => this.abrirModalAgregar());
                this.btnBackupGuardar.addEventListener('click', () => this.hacerBackup());
                this.btnBackupRecuperar.addEventListener('click', () => this.recuperarBackup());

                this.tamanoSlider.addEventListener('input', (e) => {
                    this.cambiarTamano(parseInt(e.target.value));
                });

                this.btnTamanoMenos.addEventListener('click', () => {
                    this.cambiarTamano(this.tamanoLetra - 5);
                });

                this.btnTamanoMas.addEventListener('click', () => {
                    this.cambiarTamano(this.tamanoLetra + 5);
                });

                this.modalGuardar.addEventListener('click', () => this.guardarArticuloDesdeModal());
                this.modalCancelar.addEventListener('click', () => this.cerrarModal());
                this.modalOverlay.addEventListener('click', (e) => {
                    if (e.target === this.modalOverlay) {
                        this.cerrarModal();
                    }
                });

                this.modalNombre.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.guardarArticuloDesdeModal();
                    }
                });
                this.modalCant.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.modalNombre.focus();
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (this.modalOverlay.classList.contains('active')) {
                            this.cerrarModal();
                            return;
                        }
                        if (this.editingId !== null && this.vista === 'proveedores') {
                            this.cancelarEdicionProveedor();
                        }
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!window.indexedDB) {
                document.body.innerHTML = `
                    <div style="text-align:center;padding:50px;color:#f44336;">
                        <span style="font-size:48px;">⚠️</span>
                        <h2>Tu navegador no soporta IndexedDB</h2>
                        <p>Usa un navegador moderno como Chrome, Firefox o Edge</p>
                    </div>
                `;
                return;
            }

            new App();
        });
    </script>

</body>
